name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Chrome for Testing
        run: |
          # The runner user cannot write to /opt, so install under the temp dir
          # and point the tests at it with CHROME_PATH.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl unzip \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6 fonts-liberation
          CHROME_DIR="$RUNNER_TEMP/chrome-for-testing/chrome/linux-156.0.8078.47/chrome-linux64"
          mkdir -p "$CHROME_DIR"
          curl -fsSL -o /tmp/chrome-linux64.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/linux64/chrome-linux64.zip"
          unzip -q -o /tmp/chrome-linux64.zip -d "$RUNNER_TEMP/chrome-unzip"
          mv "$RUNNER_TEMP/chrome-unzip/chrome-linux64/"* "$CHROME_DIR/"
          "$CHROME_DIR/chrome" --version
          echo "CHROME_PATH=$CHROME_DIR/chrome" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: Verify panel package contents
        working-directory: panel
        run: |
          npm pack --dry-run --json > /tmp/panel-pack.json
          node -e '
            const pack = require("/tmp/panel-pack.json")[0];
            const files = new Set(pack.files.map(f => f.path));
            const required = ["index.js", "proxy.js", "tools.js", "workspace-cleanup.js", "client.js", "cordis.patch.yml"];
            const missing = required.filter(f => !files.has(f));
            if (missing.length) { console.error("missing from panel package:", missing); process.exit(1); }
            console.log("panel package files ok:", required.join(", "));
          '

      - run: pnpm test

  # Build-only: validates the service images on each push/PR. No registry and
  # no cache export — `docker compose up -d --build` is the install path.
  # The optional DSH container (--profile web) is intentionally not built here;
  # it is the heaviest image and not needed for the plugin itself.
  docker:
    name: Images (build check)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [search, browser, brave-mcp]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: false
